name: Resolvent follow-up

# All entrypoints run trusted default-branch workflow code. Deliberately avoid
# pull_request/review triggers, which may load workflow code from a PR revision.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Optional PR number; blank reconciles all enrolled PRs
        required: false
        type: string
  issue_comment:
    types: [created, edited]
  workflow_run:
    # Replace with the exact CI/admission workflow names for prompt wakeups.
    # Scheduled reconciliation still works if no names have been configured.
    workflows: [REPLACE_WITH_CI_WORKFLOW_NAME, REPLACE_WITH_ADMISSION_WORKFLOW_NAME]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  discover:
    if: >-
      vars.RESOLVENT_FOLLOWUP_ENABLED == 'true' &&
      (github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request && !startsWith(github.event.comment.body, '<!-- resolvent-followup-state:v1')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.discover.outputs.enabled }}
      matrix: ${{ steps.discover.outputs.matrix }}
      trusted_sha: ${{ steps.discover.outputs.trusted_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5; verified 2026-10-07
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr || github.event.issue.number || '' }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            python3 .github/resolvent/controller.py discover --pr "$PR_NUMBER"
          else
            python3 .github/resolvent/controller.py discover
          fi

  reconcile:
    needs: discover
    if: needs.discover.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/resolvent-followup-pr.yml
    with:
      pr: ${{ matrix.pr }}
      trusted_sha: ${{ needs.discover.outputs.trusted_sha }}
    secrets: inherit
