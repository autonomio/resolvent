name: Publish Resolvent core

on:
  workflow_run:
    workflows: [Resolvent validation]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: resolvent-core-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'autonomio/resolvent' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Publish immutable core source reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/core_release.py publish --repository "$GITHUB_REPOSITORY"
