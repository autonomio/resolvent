name: Resolvent validation

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resolvent-validation-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  integrity:
    name: World model integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || 'main' }}
          path: policy
          persist-credentials: false
      - name: Check out proposed state as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install trusted validator dependencies
        run: python -m pip install --disable-pip-version-check -r policy/requirements.txt
      - name: Enforce model integrity and closed admission
        run: |
          python policy/scripts/compiler.py \
            --root candidate --policy-root policy --base policy --require-closure
      - name: Record the exact main push range
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/resolvent-push-range"
          python - <<'PY'
          import json, os
          from pathlib import Path
          record = {'format_version':'1.0', 'repository':os.environ['GITHUB_REPOSITORY'],
                    'before':os.environ['PUSH_BEFORE'], 'after':os.environ['PUSH_AFTER']}
          (Path(os.environ['RUNNER_TEMP'])/'resolvent-push-range/push-range.json').write_text(json.dumps(record))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push'
        with:
          name: resolvent-push-range
          path: ${{ runner.temp }}/resolvent-push-range/push-range.json
          retention-days: 7
          if-no-files-found: error

  tests:
    name: Tests and skill package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies (no secrets or write token)
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Test all input routes and failure gates
        run: python -m unittest discover -s tests -v
      - name: Verify reproducible skill package
        run: python scripts/package_skill.py --check
      - name: Test the retained observer integration
        run: python -m unittest discover -s skills/resolvent/integrations/github/tests -v
      - name: Verify reproducible ChatGPT and Claude distributions
        run: python scripts/package_plugin.py --check
      - name: Require a version bump for packaged plugin changes
        if: github.event_name == 'pull_request'
        run: python scripts/plugin_release.py check-version --base "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
