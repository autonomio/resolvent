name: Prepare Resolvent core update

on:
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Resolvent validation]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: resolvent-core-update
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      vars.RESOLVENT_CORE_UPDATES == 'true' && github.repository != 'autonomio/resolvent' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'resolvent/core/')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.RESOLVENT_AUTOMATION_TOKEN }}
      RESOLVENT_REVIEW_TOKEN: ${{ github.token }}
    steps:
      - name: Require the repository's approved automation credential
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'Core updates require RESOLVENT_AUTOMATION_TOKEN with repository workflow-file update permission.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Check out the organization's trusted updater
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RESOLVENT_AUTOMATION_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Complete the exact reviewed core update without running candidate code
        run: python scripts/core_update.py --repository "$GITHUB_REPOSITORY" --auto-merge
