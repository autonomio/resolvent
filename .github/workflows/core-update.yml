name: Prepare Resolvent core update

on:
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: resolvent-core-update
  cancel-in-progress: false

jobs:
  prepare:
    if: vars.RESOLVENT_CORE_UPDATES == 'true' && github.repository != 'autonomio/resolvent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.RESOLVENT_AUTOMATION_TOKEN }}
    steps:
      - name: Require the repository's approved automation credential
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'Core updates require RESOLVENT_AUTOMATION_TOKEN with repository workflow-file update permission.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Check out the organization's trusted updater
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RESOLVENT_AUTOMATION_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Prepare an update PR without running candidate code
        run: python scripts/core_update.py --repository "$GITHUB_REPOSITORY"
