name: Deploy public Resolvent workflow service

on:
  workflow_run:
    workflows: [Resolvent validation]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: resolvent-public-workflow-service
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'autonomio/resolvent' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/workflow_mcp/package-lock.json
      - run: npm ci --no-fund
        working-directory: scripts/workflow_mcp
      - name: Require the latest validated main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$current" = "$SOURCE_COMMIT" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload and deploy only the existing Worker
        if: steps.revision.outputs.current == 'true'
        working-directory: scripts/workflow_mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.RESOLVENT_CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.RESOLVENT_CLOUDFLARE_ACCOUNT_ID }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          WRANGLER_SEND_METRICS: 'false'
          NO_COLOR: '1'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --no-install wrangler versions upload --keep-vars --tag "$SOURCE_COMMIT"
          npx --no-install wrangler versions deploy --version-tag "$SOURCE_COMMIT@100%" --yes
