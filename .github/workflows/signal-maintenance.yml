name: Prepare change-signal maintenance

on:
  workflow_run:
    workflows: [Resolvent validation]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: resolvent-maintenance
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      vars.RESOLVENT_CHANGE_SIGNALS == 'true' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.RESOLVENT_AUTOMATION_TOKEN || github.token }}
    steps:
      - name: Check out the validated main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.RESOLVENT_AUTOMATION_TOKEN || github.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read the validated push range as data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: resolvent-push-range
          path: ${{ runner.temp }}/resolvent-push-range
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Prepare one bounded pending workset
        run: |
          mkdir -p .resolvent
          python scripts/signal_maintenance.py --repository "$GITHUB_REPOSITORY" \
            --push-range "$RUNNER_TEMP/resolvent-push-range/push-range.json" > .resolvent/signal-result.json
      - name: Record outcome
        if: always()
        run: |
          if [ -f .resolvent/signal-result.json ]; then
            cat .resolvent/signal-result.json
          fi
